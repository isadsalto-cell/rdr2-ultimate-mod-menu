
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDR2 Ultimate Menu</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090909;color:#eee;
  font-family:Arial,sans-serif;padding:20px;
}
.menu{
  max-width:430px;margin:20px auto;
  background:#171717;border:1px solid #632323;
  border-radius:14px;overflow:hidden;
  box-shadow:0 0 25px #8b171733;
}
.header{
  padding:22px;background:linear-gradient(120deg,#401010,#171717);
}
.header h2{margin:0;color:#ff5555}
.header p{color:#aaa;font-size:12px}
.tabs{display:flex;flex-wrap:wrap;background:#101010}
.tab{
  flex:1;padding:13px 8px;border:0;
  color:#aaa;background:none;font-weight:bold;
}
.tab.active{color:#ff5555;border-bottom:2px solid #ff3333}
.content{padding:16px}
.item{
  display:flex;justify-content:space-between;
  align-items:center;padding:15px 10px;
  border-bottom:1px solid #333;
}
.item small{display:block;color:#888;margin-top:5px}
.switch{
  appearance:none;
  -webkit-appearance:none;
  width:46px;
  height:25px;
  background:#444;
  border-radius:30px;
  position:relative;
  cursor:pointer;
  transition:.25s;
  flex-shrink:0;
}

.switch:checked{
  background:#e32636;
  box-shadow:0 0 12px #e3263677;
}

.switch::before{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.25s;
}

.switch:checked::before{
  transform:translateX(21px);
}
.footer{text-align:center;padding:14px;color:#777;font-size:11px}
</style>
</head>
<body>
<div class="menu">
  <div class="header">
    <h2>RDR2 ULTIMATE</h2>
    <p>PS4 PROJECT • CUSA03041 • v1.32</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
  <div class="footer">UI PROTOTYPE • VERSION 1.0</div>
</div>
<script>
const sections={
 Player:["God Mode UI","Infinite Stamina UI","Health Display"],
 Weapons:["Weapon Options","Ammo Display","Hip Fire Options","Aim Assist Options"],
 Smoking:["Extended Smoking UI","Smoking Animation Options"],
 Horse:["Horse Options","Horse Customization"],
 Teleport:["Location Selector","Fast Travel UI"],
 World:["Weather Selector","Time Control"],
 Visual:["Camera Options","Visual Effects"],
 Settings:["Menu Theme","Menu Information"]
};
const tabs=document.getElementById("tabs");
const content=document.getElementById("content");


function show(name){
 document.querySelectorAll(".tab").forEach(b=>{
  b.classList.toggle("active",b.textContent===name);
 });

 content.innerHTML="";

 if(name==="Smoking"){
  content.innerHTML=`
   <h3 style="color:#ff5555">SMOKING CONTROL</h3>

   <div class="item">
    <div>Extended Smoking UI</div>
    <input class="switch" type="checkbox">
   </div>

   <div class="item">
    <div>Smoking Animation</div>
    <input class="switch" type="checkbox">
   </div>

   <div style="padding:15px">
    <label>Duration: <b id="duration">10s</b></label>
    <input id="durationSlider" type="range"
    min="1" max="30" value="10"
    style="width:100%">
   </div>

   <div class="item">
    <div>Repeat Animation</div>
    <input class="switch" type="checkbox">
   </div>

   <button id="preview"
    style="width:100%;padding:14px;background:#a52222;color:white;border:0;border-radius:8px">
    ANIMATION PREVIEW
   </button>

   <p id="previewStatus" style="text-align:center;color:#aaa">
    Preview ready
   </p>
  `;

  const slider=document.getElementById("durationSlider");
  slider.oninput=()=>{
   document.getElementById("duration").textContent=slider.value+"s";
  };

  document.getElementById("preview").onclick=()=>{
   document.getElementById("previewStatus").textContent=
   "Preview selected!";
  };

  return;
 }

 sections[name].forEach(label=>{
  const row=document.createElement("div");
  row.className="item";
  row.innerHTML=`<div>${label}<small>Prototype control</small></div>
  <input class="switch" type="checkbox" aria-label="${label}">`;
  content.appendChild(row);
 });
}

Object.keys(sections).forEach(name=>{
 const b=document.createElement("button");
 b.className="tab";
 b.textContent=name;
 b.onclick=()=>show(name);
 tabs.appendChild(b);
});
show("Player");
</script>
</body>
</html>
