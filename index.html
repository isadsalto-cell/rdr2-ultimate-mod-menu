
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDR2 Ultimate Trainer</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101010;color:#ddd;
 font-family:Arial,sans-serif;
}
header{
 height:65px;background:#191919;
 border-bottom:2px solid #a92727;
 display:flex;align-items:center;
 padding:0 22px;justify-content:space-between;
}
header h2{font-size:18px;color:#eee}
.status{font-size:12px;color:#aaa}
main{display:flex;min-height:calc(100vh - 65px)}
.sidebar{
 width:190px;background:#181818;
 border-right:1px solid #333;padding:15px 10px;
}
.tab{
 display:block;width:100%;padding:13px;
 margin-bottom:5px;background:transparent;
 color:#aaa;border:0;text-align:left;
 cursor:pointer;border-radius:4px;
}
.tab:hover,.tab.active{
 background:#702020;color:white;
}
.content{flex:1;padding:25px;max-width:850px}
.content h3{
 color:#e34b4b;border-bottom:1px solid #383838;
 padding-bottom:12px;
}
.item{
 background:#1d1d1d;border:1px solid #303030;
 padding:15px;margin:10px 0;
 display:flex;align-items:center;
 justify-content:space-between;border-radius:5px;
}
.item small{display:block;color:#777;margin-top:5px}
.switch{
 appearance:none;width:42px;height:22px;
 background:#444;border-radius:20px;
 position:relative;cursor:pointer;
}
.switch:checked{background:#c52d2d}
.switch:before{
 content:"";position:absolute;
 width:16px;height:16px;background:white;
 border-radius:50%;top:3px;left:3px;
 transition:.2s;
}
.switch:checked:before{transform:translateX(20px)}
input[type=range]{accent-color:#d43b3b}
.action{
 background:#702020;color:white;border:0;
 padding:11px 18px;border-radius:4px;
 cursor:pointer;
}
.action:hover{background:#963030}
@media(max-width:600px){
 main{flex-direction:column}
 .sidebar{width:100%;display:flex;overflow-x:auto}
 .tab{min-width:105px;text-align:center}
 .content{padding:15px}
}
</style>
</head>

<body>
<header>
 <h2>RDR2 ULTIMATE TRAINER</h2>
 <div class="status">PC EDITION | UI PROTOTYPE</div>
</header>

<main>
 <nav class="sidebar" id="tabs"></nav>
 <section class="content" id="content"></section>
</main>

<script>
const sections={
 Player:[
 "God Mode","Infinite Stamina","Health Display",
 "Stamina Display","Movement Options","Player Status""Character Model Selector",
"NPC Model Selector",
"Gang Member Selector"],
 Weapons:[
 "Weapon Selector",
 "Ammo Display",
 "Unlimited Ammo",
 "No Reload",
 "Weapon Damage",
 "Weapon Condition",
 "Weapon Customization",
 "Loadout Presets"
],
 Smoking:[
 "Extended Smoking","Smoking Animation","Repeat Animation"
 ],
 Horse:[
 "Horse Selector","Unlimited Horse Stamina","Horse Health",
 "Horse Bonding","Horse Speed","Horse Whistle"
 ],
 Teleport:[
 "Teleport to Valentine","Teleport to Saint Denis",
 "Teleport to Blackwater","Teleport to Rhodes",
 "Teleport to Strawberry","Teleport to Camp",
 "Custom Coordinates"
 ],
 World:[
 "Time Control","Weather Control","Clear Weather",
 "Rain","Thunderstorm","Snow","World Time Scale","Freeze World"
 ],
 Visual:[
 "HUD Toggle","FPS Counter","Player Coordinates",
 "Map Display","Waypoint Display","Time Display",
 "Weather Display","Performance Monitor"
 ],
 Settings:[
 "Menu Theme","Menu Opacity","UI Scale",
 "Toggle Hotkey","Save Configuration",
 "Load Configuration","Reset Settings","About Trainer"
 ]
};

const tabs=document.getElementById("tabs");
const content=document.getElementById("content");

const STORAGE_KEY="rdr2_trainer_settings";

let settings={};
let duration=10;

function loadSettings(){
 try{
  settings=JSON.parse(
   localStorage.getItem(STORAGE_KEY)
  )||{};
  duration=Number(
   localStorage.getItem("rdr2_duration")
  )||10;
 }catch(e){
  settings={};
  duration=10;
 }
}

function saveSettings(){
 localStorage.setItem(
  STORAGE_KEY,JSON.stringify(settings)
 );
 localStorage.setItem(
  "rdr2_duration",duration
 );
}

function resetSettings(){
 settings={};
 duration=10;
 saveSettings();
 show("Settings");
}

function show(name){
 document.querySelectorAll(".tab").forEach(b=>{
  b.classList.toggle("active",b.textContent===name);
 });

 content.innerHTML="<h3>"+name.toUpperCase()+"</h3>";

 sections[name].forEach(label=>{
  const row=document.createElement("div");
  row.className="item";

  const title=document.createElement("div");
  title.textContent=label;

  const small=document.createElement("small");
  small.textContent="Browser prototype setting";
  title.appendChild(small);

  row.appendChild(title);

  if(name==="Settings" &&
     ["Save Configuration","Load Configuration",
      "Reset Settings","About Trainer"].includes(label)){

   const btn=document.createElement("button");
   btn.className="action";
   btn.textContent="Open";

   btn.onclick=()=>{
    if(label==="Save Configuration"){
     saveSettings();
     btn.textContent="Saved!";
    }

    if(label==="Load Configuration"){
     loadSettings();
     show("Settings");
    }

    if(label==="Reset Settings"){
     resetSettings();
    }

    if(label==="About Trainer"){
     alert("RDR2 Ultimate Trainer - PC UI Prototype");
    }
   };

   row.appendChild(btn);

  }else{
   const toggle=document.createElement("input");
   toggle.type="checkbox";
   toggle.className="switch";

   const key=name+"_"+label;
   toggle.checked=!!settings[key];

   toggle.onchange=()=>{
    settings[key]=toggle.checked;
    saveSettings();
   };

   row.appendChild(toggle);
  }

  content.appendChild(row);
 });

 if(name==="Smoking"){
  const slider=document.createElement("div");
  slider.className="item";

  slider.innerHTML=`
   <div style="width:100%">
    <div>Smoking Duration:
     <b id="duration">${duration}s</b>
    </div>
    <input id="durationSlider" type="range"
    min="1" max="30" value="${duration}"
    style="width:100%">
   </div>
  `;

  content.appendChild(slider);

  document.getElementById("durationSlider").oninput=e=>{
   duration=Number(e.target.value);
   document.getElementById("duration").textContent=
    duration+"s";
   saveSettings();
  };
 }

 const info=document.createElement("p");
 info.style.color="#777";
 info.style.fontSize="12px";
 info.textContent=
 "Visual prototype only — no game connection.";

 content.appendChild(info);
}

Object.keys(sections).forEach(name=>{
 const button=document.createElement("button");
 button.className="tab";
 button.textContent=name;
 button.onclick=()=>show(name);
 tabs.appendChild(button);
});

loadSettings();
show("Player");
</script>
</body>
</html>
